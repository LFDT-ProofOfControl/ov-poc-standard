name: Paper PDF

# The paper download went five weeks stale once. This workflow keeps it
# honest: every PR touching the paper proves the source still compiles, and
# every merge to master rebuilds the PDF and publishes it to the paper-latest
# release, which is the public download URL the READMEs link.
on:
  push:
    branches: [master]
    paths:
      - 'paper/**'
      - 'images/diagrams/**'
      - 'tools/generate_diagrams.py'
      - 'tools/generate_charts.py'
      - 'tools/build_paper_figures.sh'
  pull_request:
    paths:
      - 'paper/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin python3-pygments
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
      - name: Build the figures from the repository's SVGs
        run: ./tools/build_paper_figures.sh
      - name: Compile the paper
        run: |
          cd paper
          tectonic -Z shell-escape main.tex
      - name: Upload the PDF for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: proof-of-control-paper
          path: paper/main.pdf
      # Master is protected (LFDT repository rules reject direct pushes, the
      # bot's included), so the fresh build is published as a release asset:
      # a stable public download URL that CI refreshes on every merge.
      - name: Publish the fresh PDF to the paper-latest release (master only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view paper-latest >/dev/null 2>&1 || \
            gh release create paper-latest --title "Proof-of-Control paper - latest build" \
              --notes "Rebuilt by CI from master on every merge that touches the paper. Download main.pdf below." \
              --latest=false
          gh release upload paper-latest paper/main.pdf --clobber
